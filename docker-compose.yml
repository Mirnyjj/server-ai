services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ig-agent-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      searxng:
    image: searxng/searxng:latest
    container_name: ig-agent-searxng
    restart: unless-stopped
    volumes:
      - searxng_config:/etc/searxng
      - searxng_cache:/var/cache/searxng
    expose:
      - "8080"

  redis:
        condition: service_started
      whisper:
        condition: service_started
      searxng:
        condition: service_started

    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: ig-agent-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: ig-agent-whisper
    restart: unless-stopped

    environment:
      WHISPER_MODEL: base
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: "1"

    mem_limit: 1200m
    cpus: "0.8"

volumes:
  redis_data:
  searxng_config:
  searxng_cache:
