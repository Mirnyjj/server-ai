services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ig-agent-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_started

    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: ig-agent-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

volumes:
  redis_data:
